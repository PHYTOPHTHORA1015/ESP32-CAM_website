<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP32-CAM Wi-Fi OTA 通訊測試</title><style>body{font:16px system-ui,sans-serif;background:#f3f6fb;color:#15243a;margin:0}main{max-width:480px;margin:24px auto;background:white;padding:24px;border-radius:18px}button,select{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;font:inherit;border-radius:8px}button{background:#1769e0;color:white;border:0}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f7;padding:12px}progress{width:100%}</style><main><h2>ESP32-CAM Wi-Fi OTA C3 完整傳輸測試</h2><p>不寫入 Flash。先使用網際網路下載，再切換至 ESP32CAM-Config（密碼 12345678），返回本頁，不要關閉分頁。</p><select id="versions"></select><button id="refresh">重新讀取 GitHub 版本</button><button id="download">① 下載並暫存程式碼</button><button id="ping">② 測試 ESP32 連線</button><button id="send">③ 傳送暫存程式碼</button><button id="formSend">④ Safari 表單傳送完整程式碼</button><form id="nativeForm" action="http://192.168.4.1/form-full" method="post" enctype="multipart/form-data" hidden><input type="file" name="firmware" id="nativeFile"></form><progress id="progress" max="100" value="0"></progress><pre id="log">初始化中…</pre><p>若瀏覽器阻擋 HTTPS 至 HTTP 的請求，請記錄錯誤；本測試不會繞過瀏覽器安全限制。</p></main><script>
const $=id=>document.getElementById(id), base='http://192.168.4.1';let versions=[],cached=null,busy=false;
function log(t){$('log').textContent=t}function lock(v){busy=v;for(const id of ['refresh','download','ping','send','formSend'])$(id).disabled=v;}
const db=new Promise((resolve,reject)=>{const r=indexedDB.open('esp32-ota-c-test',1);r.onupgradeneeded=()=>r.result.createObjectStore('firmware');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function store(value){const d=await db;return new Promise((resolve,reject)=>{const t=d.transaction('firmware','readwrite');t.objectStore('firmware').put(value,'current');t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
async function restore(){const d=await db;return new Promise((resolve,reject)=>{const r=d.transaction('firmware').objectStore('firmware').get('current');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function load(){const r=await fetch('firmware/versions.json',{cache:'no-store'});if(!r.ok)throw Error('版本清單 HTTP '+r.status);versions=(await r.json()).versions.filter(v=>typeof v.version==='string'&&/^[\w.-]+\.bin$/.test(v.file));$('versions').replaceChildren(...versions.map((v,i)=>new Option('v'+v.version+' — '+(v.description||''),i)));}
async function run(fn){if(busy)return;lock(true);try{await fn()}catch(e){log('失敗：'+e.message+'\n若已切換 Wi-Fi，請確認手機連到 ESP32CAM-Config；也可能是瀏覽器安全限制。')}finally{lock(false)}}
$('refresh').onclick=()=>run(async()=>{await load();log('版本清單已載入')});
$('download').onclick=()=>run(async()=>{const v=versions[$('versions').value];if(!v)throw Error('請選擇版本');const r=await fetch('firmware/'+v.file,{cache:'no-store'});if(!r.ok)throw Error('下載 HTTP '+r.status);const bytes=await r.arrayBuffer();if(!bytes.byteLength||bytes.byteLength>1966080)throw Error('檔案大小不符');const sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');const next={version:v.version,file:v.file,bytes,sha};await store(next);cached=next;log('已暫存 v'+v.version+'\n'+bytes.byteLength+' bytes\nSHA-256: '+sha+'\n現在切換 Wi-Fi，再返回本頁。')});
$('ping').onclick=()=>run(async()=>{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);try{const r=await fetch(base+'/ping',{signal:controller.signal});if(!r.ok||await r.text()!=='ESP32-OTA-C-TEST')throw Error('非測試裝置');log('ESP32 連線成功')}finally{clearTimeout(timer)}});
$('send').onclick=()=>run(async()=>{cached=await restore();if(!cached)throw Error('沒有暫存程式碼');const form=new FormData();form.append('firmware',new Blob([cached.bytes]),cached.file);$('progress').value=0;const start=performance.now();const result=await new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('POST',base+'/upload');x.timeout=120000;x.upload.onprogress=e=>{if(e.lengthComputable)$('progress').value=e.loaded/e.total*100};x.onload=()=>{try{if(x.status!==200)throw Error('HTTP '+x.status+' '+x.responseText);resolve(JSON.parse(x.responseText))}catch(e){reject(e)}};x.onerror=()=>reject(Error('網路請求被阻擋或連線失敗'));x.ontimeout=()=>reject(Error('傳輸逾時'));x.send(form)});const sec=(performance.now()-start)/1000;if(!result.ok||result.bytes!==cached.bytes.byteLength||result.sha256!==cached.sha)throw Error('資料驗證不一致');$('progress').value=100;log('傳輸成功，SHA-256 一致\n'+result.bytes+' bytes\n手機端 '+sec.toFixed(2)+' 秒，'+(result.bytes/1024/sec).toFixed(1)+' KiB/s\nESP32 接收 '+result.ms+' ms\n未寫入 Flash。')});
$('formSend').onclick=()=>run(async()=>{cached=await restore();if(!cached)throw Error('沒有暫存程式碼');const file=new File([cached.bytes],cached.sha+'.bin',{type:'application/octet-stream'});const dt=new DataTransfer();dt.items.add(file);$('nativeFile').files=dt.files;if($('nativeFile').files.length!==1||$('nativeFile').files[0].size!==cached.bytes.byteLength)throw Error('瀏覽器不支援自動填入檔案');log('正在提交表單，請等待 ESP32 回應');$('nativeForm').submit()});
(async()=>{try{cached=await restore();if(cached)log('已恢復暫存 v'+cached.version+'，'+cached.bytes.byteLength+' bytes');else log('請先下載程式碼');try{await load()}catch(e){if(!cached)log('版本清單載入失敗：'+e.message)}}catch(e){log('初始化失敗：'+e.message)}})();
</script></html>
